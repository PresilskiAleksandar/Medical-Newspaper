name: Daily Article Generation

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: ./server
      - run: node scripts/daily_generator.js
        working-directory: ./server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
